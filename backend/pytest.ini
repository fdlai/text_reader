[pytest]
# Run from the backend folder: ./.venv/Scripts/pytest
pythonpath = .
testpaths = tests
# Async test functions run without needing a marker on each one.
asyncio_mode = auto
# One event loop for the whole run, since the database connections are
# shared between tests and belong to the loop that opened them.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
